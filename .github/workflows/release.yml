name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: build the whole matrix on demand without publishing anything, so
  # a cross-compile break is caught before a tag is cut (the release job below
  # only runs for a tag push).
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: tar -czf orbit-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release orbit

      - uses: actions/upload-artifact@v4
        with:
          name: orbit-${{ matrix.target }}
          path: orbit-${{ matrix.target }}.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: orbit-*.tar.gz
          generate_release_notes: true

  # Point the Homebrew formula (Formula/orbit.rb — this repo is also the tap)
  # at the release just published, so `brew upgrade` picks it up.
  homebrew:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Regenerate formula
        run: scripts/homebrew-formula.sh "$GITHUB_REF_NAME" dist > Formula/orbit.rb

      - name: Commit to main
        run: |
          git diff --quiet -- Formula/orbit.rb && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Homebrew formula for $GITHUB_REF_NAME" -- Formula/orbit.rb
          # main may have moved while the matrix built.
          git pull --rebase origin main
          git push origin HEAD:main
