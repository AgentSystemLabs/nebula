[workspace]
resolver = "2"
members = ["crates/nebula-core", "crates/nebula-daemon", "crates/nebula-tui", "crates/nebula"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
nebula-core = { path = "crates/nebula-core" }
nebula-daemon = { path = "crates/nebula-daemon" }
nebula-tui = { path = "crates/nebula-tui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
rmp-serde = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "signal", "sync", "time", "macros", "io-util", "fs"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "1", features = ["serde"] }
directories = "5"

[profile.release]
lto = "thin"
strip = true
opt-level = "z"
codegen-units = 1
