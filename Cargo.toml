[workspace]
resolver = "2"
members = ["crates/nebula-core", "crates/nebula-daemon", "crates/nebula-tui", "crates/nebula"]
exclude = ["vendor/vt100"]

# Vendored vt100 with one patch: rows scrolled out of a top-anchored DECSTBM
# region on the primary screen go into scrollback (upstream discards them).
# Without it, codex's ratatui inline viewport leaves the TUI scrollback empty
# — wheel-up over a codex agent did nothing. See vendor/vt100/Cargo.toml.
[patch.crates-io]
vt100 = { path = "vendor/vt100" }

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
nebula-core = { path = "crates/nebula-core" }
nebula-daemon = { path = "crates/nebula-daemon" }
nebula-tui = { path = "crates/nebula-tui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
rmp-serde = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "signal", "sync", "time", "macros", "io-util", "fs"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "3", features = ["serde"] }
directories = "6"

[profile.release]
lto = "thin"
# Keep the symbol table (drop only debug info) so the crash-log panic
# backtraces show function names instead of bare addresses.
strip = "debuginfo"
opt-level = "z"
codegen-units = 1
