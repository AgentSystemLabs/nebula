[workspace]
resolver = "2"
members = ["crates/nebula-core", "crates/nebula-daemon", "crates/nebula-fuzzy", "crates/nebula-tui", "crates/nebula"]
exclude = ["vendor/vt100"]

# Vendored vt100 with one patch: rows scrolled out of a top-anchored DECSTBM
# region on the primary screen go into scrollback (upstream discards them).
# Without it, codex's ratatui inline viewport leaves the TUI scrollback empty
# — wheel-up over a codex agent did nothing. See vendor/vt100/Cargo.toml.
[patch.crates-io]
vt100 = { path = "vendor/vt100" }

[workspace.package]
version = "0.40.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
nebula-core = { path = "crates/nebula-core" }
nebula-daemon = { path = "crates/nebula-daemon" }
nebula-tui = { path = "crates/nebula-tui" }
nebula-fuzzy = { path = "crates/nebula-fuzzy" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
rmp-serde = "1.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "signal", "sync", "time", "macros", "io-util", "fs"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = { version = "3", features = ["serde"] }
directories = "6"
portable-pty = "0.9"
vt100 = "0.16"
tempfile = "3"

# Dependencies at full optimisation in dev builds too. The terminal
# emulation (vt100, tui-term, ratatui) is the TUI's hot path: unoptimised,
# a 1 MB scrollback replay parses in 50–140 ms against under 15 ms, and
# every session switch paid it — a `cargo run` build felt sluggish where
# the release one didn't. Only the workspace crates stay at opt-level 0,
# so incremental builds are as quick as before.
[profile.dev.package."*"]
opt-level = 3

# …and the one workspace crate that is a hot loop and nothing else: the
# fuzzy matcher runs over every path of a checkout on every keystroke of
# the FILE FINDER. Unoptimised that is 13–27 ms a character over ten
# thousand paths, felt as a filter that lags the typing; it is a few
# hundred lines that rarely change, so optimising it costs the edit-build
# loop nothing.
[profile.dev.package.nebula-fuzzy]
opt-level = 3

[profile.release]
lto = "thin"
# Keep the symbol table (drop only debug info) so the crash-log panic
# backtraces show function names instead of bare addresses.
strip = "debuginfo"
opt-level = "z"
codegen-units = 1
